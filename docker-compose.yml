version: '3.8'

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Africa/Casablanca}
    volumes:
      - ./config/jellyfin:/config
      - ./media:/data
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"

  downloader:
    build: .
    container_name: jellyfin-downloader
    restart: unless-stopped
    environment:
      - PORT=${DOWNLOADER_PORT:-5000}
      - MEDIA_ROOT=/media
      - DATA_DIR=/app/data
      - APP_DIR=/app
    volumes:
      - ./media:/media
      - ./config/downloader:/app/data
    ports:
      - "${DOWNLOADER_PORT:-5000}:5000"
    depends_on:
      - jellyfin
